<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROCUREMENT AND ENGINEERING HUB</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#050505;
    height:100vh;
}

/* Moving Text Area */
.chain-container{
    position:absolute;
    top:50%;
    left:0;
    width:100%;
    height:250px;
    transform:translateY(-50%);
    overflow:hidden;
}

.chain{
    position:absolute;
    display:flex;
    align-items:center;
    white-space:nowrap;
    animation:moveText 24s linear infinite;
    will-change:transform;
}

.text-item{
    font-family:Arial, Helvetica, sans-serif;
    font-size:140px;
    font-weight:900;
    letter-spacing:6px;
    margin-right:220px;

    background:linear-gradient(
        180deg,
        #fff8b0 0%,
        #ffe96a 20%,
        #ffd700 45%,
        #ffb300 75%,
        #8b6508 100%
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;

    text-transform:uppercase;
    text-shadow:none;
}

@keyframes moveText{
    from{
        transform:translateX(0);
    }
    to{
        transform:translateX(-50%);
    }
}

/* Train Sparks */
.spark{
    position:absolute;
    border-radius:50%;
    background:#ffd700;
    pointer-events:none;

    box-shadow:
        0 0 4px #ffd700,
        0 0 8px #ffae00,
        0 0 16px #ff7b00;
}
</style>
</head>
<body>

<div class="chain-container">
    <div class="chain" id="chain"></div>
</div>

<script>

// Create moving text
const chain = document.getElementById("chain");

for(let i=0;i<20;i++){
    const txt = document.createElement("div");
    txt.className = "text-item";
    txt.textContent = "PROCUREMENT AND ENGINEERING HUB";
    chain.appendChild(txt);
}

// Emit sparks from bottom of moving text
function createSpark(){

    const rect = chain.getBoundingClientRect();

    // Random point along visible text
    const x = rect.left + Math.random() * Math.min(rect.width, window.innerWidth + 400);

    // Bottom edge of text
    const y = rect.top + rect.height - 15;

    const spark = document.createElement("div");
    spark.className = "spark";

    let px = x;
    let py = y;

    const size = Math.random() * 3 + 2;

    spark.style.width = size + "px";
    spark.style.height = size + "px";
    spark.style.left = px + "px";
    spark.style.top = py + "px";

    document.body.appendChild(spark);

    // Downward-right trajectory
    let vx = Math.random() * 12 + 8;
    let vy = Math.random() * 4 + 2;

    let opacity = 1;

    const anim = setInterval(()=>{

        px += vx;
        py += vy;

        vx *= 0.985;
        vy += 0.18;

        spark.style.left = px + "px";
        spark.style.top = py + "px";

        opacity -= 0.02;
        spark.style.opacity = opacity;

        if(opacity <= 0){
            clearInterval(anim);
            spark.remove();
        }

    },16);
}

// Continuous spark shower
setInterval(createSpark,5);

</script>

</body>
</html>
