<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROCUREMENT AND ENGINEERING HUB</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#050505;
    height:100vh;
}

/* Text Track */
.chain-container{
    position:absolute;
    top:50%;
    left:0;
    width:100%;
    height:150px;
    transform:translateY(-50%);
    overflow:hidden;
}

/* Moving Text */
.chain{
    position:absolute;
    display:flex;
    align-items:center;
    white-space:nowrap;
    animation:moveText 12s linear infinite;
}

/* Golden Text */
.text-item{
    font-family:Arial, Helvetica, sans-serif;
    font-size:70px;
    font-weight:900;
    margin-right:120px;
    letter-spacing:4px;

    background:linear-gradient(
        180deg,
        #fff8b0 0%,
        #ffd700 40%,
        #ffb300 70%,
        #8b6508 100%
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;

    text-transform:uppercase;

    text-shadow:
        0 0 8px rgba(255,215,0,0.9),
        0 0 20px rgba(255,215,0,0.8),
        0 0 40px rgba(255,215,0,0.6);
}

@keyframes moveText{
    from{
        transform:translateX(0);
    }
    to{
        transform:translateX(-50%);
    }
}

/* Sparks */
.spark{
    position:absolute;
    width:4px;
    height:4px;
    border-radius:50%;
    background:gold;

    box-shadow:
        0 0 10px gold,
        0 0 20px orange;

    pointer-events:none;
}
</style>
</head>
<body>

<div class="chain-container">
    <div class="chain" id="chain"></div>
</div>

<script>

// Create repeated moving text
const chain = document.getElementById("chain");

for(let i=0;i<20;i++){

    const txt = document.createElement("div");
    txt.className = "text-item";
    txt.textContent = "PROCUREMENT AND ENGINEERING HUB";

    chain.appendChild(txt);
}

// Create sparks
function createSpark(){

    const spark = document.createElement("div");
    spark.className = "spark";

    let x = Math.random() * window.innerWidth;

    let y = window.innerHeight/2 +
            (Math.random()*60 - 30);

    spark.style.left = x + "px";
    spark.style.top = y + "px";

    document.body.appendChild(spark);

    const speedX = Math.random()*4 + 2;
    const speedY = Math.random()*3 - 1.5;

    let opacity = 1;

    const interval = setInterval(()=>{

        x += speedX;
        y += speedY;

        spark.style.left = x + "px";
        spark.style.top = y + "px";

        opacity -= 0.03;
        spark.style.opacity = opacity;

        if(opacity <= 0){
            clearInterval(interval);
            spark.remove();
        }

    },20);
}

setInterval(createSpark,40);

</script>

</body>
</html>
