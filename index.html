<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROCUREMENT AND ENGINEERING HUB</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#050505;
    height:100vh;
}

/* Text Area */
.chain-container{
    position:absolute;
    top:50%;
    left:0;
    width:100%;
    height:260px;
    transform:translateY(-50%);
    overflow:hidden;
}

/* Moving Text */
.chain{
    position:absolute;
    display:flex;
    align-items:center;
    white-space:nowrap;
    animation:moveText 36s linear infinite;
    will-change:transform;
}

.text-item{
    font-family:Arial, Helvetica, sans-serif;
    font-size:140px;
    font-weight:900;
    letter-spacing:6px;
    margin-right:220px;

    background:linear-gradient(
        180deg,
        #fff8b0 0%,
        #fff18a 15%,
        #ffd700 40%,
        #ffb300 70%,
        #8b6508 100%
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;

    text-transform:uppercase;
    text-shadow:none;
}

@keyframes moveText{
    from{
        transform:translateX(0);
    }
    to{
        transform:translateX(-50%);
    }
}

/* Sparks */
.spark{
    position:absolute;
    border-radius:50%;
    pointer-events:none;

    background:#ffd700;

    box-shadow:
        0 0 3px #ffd700,
        0 0 8px #ffb300,
        0 0 15px #ff8c00,
        0 0 25px #ff4500;
}
</style>
</head>
<body>

<div class="chain-container">
    <div class="chain" id="chain"></div>
</div>

<script>

const chain = document.getElementById("chain");

/* Create repeated text */
for(let i=0;i<20;i++){

    const txt = document.createElement("div");
    txt.className = "text-item";
    txt.textContent = "PROCUREMENT AND ENGINEERING HUB";

    chain.appendChild(txt);
}

/* Continuous Sparks */
const sparks = [];

function createSpark(){

    const rect = chain.getBoundingClientRect();

    for(let i=0;i<40;i++){

        const spark = document.createElement("div");
        spark.className = "spark";

        let x =
            rect.left +
            Math.random() *
            Math.min(rect.width, window.innerWidth + 800);

        let y =
            rect.top +
            rect.height -
            20 +
            Math.random() * 10;

        const size = Math.random() * 3 + 1.5;

        spark.style.width = size + "px";
        spark.style.height = size + "px";

        spark.style.left = x + "px";
        spark.style.top = y + "px";

        document.body.appendChild(spark);

        sparks.push({
            el:spark,
            x:x,
            y:y,
            vx:Math.random()*12 + 10,
            vy:Math.random()*3 + 2,
            opacity:1
        });
    }
}

/* Emit continuously */
setInterval(createSpark,16);

/* Smooth animation */
function animateSparks(){

    for(let i=sparks.length-1;i>=0;i--){

        const s = sparks[i];

        s.x += s.vx;
        s.y += s.vy;

        s.vx *= 0.985;
        s.vy += 0.18;

        s.opacity -= 0.015;

        s.el.style.left = s.x + "px";
        s.el.style.top = s.y + "px";
        s.el.style.opacity = s.opacity;

        if(s.opacity <= 0){

            s.el.remove();
            sparks.splice(i,1);
        }
    }

    requestAnimationFrame(animateSparks);
}

animateSparks();

</script>

</body>
</html>
