<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROCUREMENT AND ENGINEERING HUB</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#050505;
    height:100vh;
}

/* Text Area */
.chain-container{
    position:absolute;
    top:50%;
    left:0;
    width:100%;
    height:260px;
    transform:translateY(-50%);
    overflow:hidden;
}

.chain{
    position:absolute;
    display:flex;
    align-items:center;
    white-space:nowrap;
    animation:moveText 50s linear infinite;
    will-change:transform;
}

.text-item{
    font-family:Arial, Helvetica, sans-serif;
    font-size:140px;
    font-weight:900;
    letter-spacing:6px;
    margin-right:220px;

    background:linear-gradient(
        180deg,
        #fff8b0 0%,
        #fff18a 15%,
        #ffd700 40%,
        #ffb300 70%,
        #8b6508 100%
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;

    text-transform:uppercase;
    text-shadow:none;
}

.letter{
    display:inline-block;
    position:relative;
}

@keyframes moveText{
    from{
        transform:translateX(0);
    }
    to{
        transform:translateX(-50%);
    }
}

/* Sparks */
.spark{
    position:absolute;
    border-radius:50%;
    pointer-events:none;

    background:#ffd700;

    box-shadow:
        0 0 3px #ffd700,
        0 0 8px #ffb300,
        0 0 15px #ff8c00,
        0 0 25px #ff4500;
}
</style>
</head>
<body>

<div class="chain-container">
    <div class="chain" id="chain"></div>
</div>

<script>

const chain = document.getElementById("chain");

const phrase = "PROCUREMENT AND ENGINEERING HUB";

/* Create repeated text */
for(let r=0;r<20;r++){

    const txt = document.createElement("div");
    txt.className = "text-item";

    [...phrase].forEach(char=>{

        const span = document.createElement("span");
        span.className = "letter";
        span.textContent = char;

        txt.appendChild(span);
    });

    chain.appendChild(txt);
}

const sparks = [];

/* Emit sparks from every visible letter */
function emitLetterSparks(){

    const letters =
        document.querySelectorAll('.letter');

    letters.forEach(letter=>{

        const rect =
            letter.getBoundingClientRect();

        if(
            rect.right < 0 ||
            rect.left > window.innerWidth
        ){
            return;
        }

        const spark =
            document.createElement("div");

        spark.className = "spark";

        let x =
            rect.left +
            rect.width / 2 +
            (Math.random()*8 - 4);

        let y =
            rect.bottom - 6;

        const size =
            Math.random()*2 + 1.5;

        spark.style.width =
            size + "px";

        spark.style.height =
            size + "px";

        spark.style.left =
            x + "px";

        spark.style.top =
            y + "px";

        document.body.appendChild(spark);

        sparks.push({

            el:spark,

            x:x,
            y:y,

            vx:
                Math.random()*8 + 8,

            vy:
                Math.random()*2 + 1,

            opacity:1
        });

    });
}

/* Dense continuous sparks */
setInterval(emitLetterSparks,40);

/* Animate sparks */
function animateSparks(){

    for(
        let i=sparks.length-1;
        i>=0;
        i--
    ){

        const s = sparks[i];

        s.x += s.vx;
        s.y += s.vy;

        s.vx *= 0.985;
        s.vy += 0.15;

        s.opacity -= 0.02;

        s.el.style.left =
            s.x + "px";

        s.el.style.top =
            s.y + "px";

        s.el.style.opacity =
            s.opacity;

        if(s.opacity <= 0){

            s.el.remove();

            sparks.splice(i,1);
        }
    }

    requestAnimationFrame(
        animateSparks
    );
}

animateSparks();

</script>

</body>
</html>
